# Builds the workers and the trimmed Java runtime for each platform, checks
# them, and on a v* tag publishes the archives and their SHA-256 sums as a
# GitHub release.
name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-aarch64
            runner: macos-15
          - platform: linux-x86_64
            runner: ubuntu-24.04
            container: debian:bookworm-slim@sha256:99c0b25c46d0214d5a2091092e7908907dcaecd6a962cde0ac700acee222b6f3
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            container: debian:bookworm-slim@sha256:99c0b25c46d0214d5a2091092e7908907dcaecd6a962cde0ac700acee222b6f3
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build (Linux, inside Debian bookworm)
        if: startsWith(matrix.platform, 'linux-')
        run: ci/linux.sh --inside --clean
      - name: Build (macOS)
        if: matrix.platform == 'macos-aarch64'
        run: |
          brew install ninja
          python3 -m venv "$RUNNER_TEMP/buildtools"
          "$RUNNER_TEMP/buildtools/bin/pip" install -q --require-hashes -r ci/requirements.txt
          PATH="$RUNNER_TEMP/buildtools/bin:$PATH" ./build.sh --clean
      - name: Smoke test
        run: ci/smoke.sh dist "${{ matrix.platform }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Check the tag matches VERSION
        run: test "v$(cat VERSION)" = "$GITHUB_REF_NAME"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          cat SHA256SUMS-* > SHA256SUMS
          sha256sum -c SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --notes "Built by CI from $GITHUB_SHA. Source, build script and pinned sources: this tag." \
            ./*.tar.xz SHA256SUMS
